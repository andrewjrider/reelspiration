# Render deployment blueprint for Reelspiration.com
# Push this repo to GitHub, then in Render: New -> Blueprint -> select this repo.
# Render will read this file and provision the service automatically.
services:
  - type: web
    name: reelspiration
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
    autoDeploy: true
